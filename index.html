<style>
/* Layout: one centered column of "cards" like a party-game table; stamps mark unique vs copied answers */
:root{
  --bg:#EDF3F0; --surface:#FFFFFF; --ink:#13231D; --muted:#5A6D66; --line:#D2DDD8; --chip:#E2ECE7;
  --accent:#FF5442; --accent-ink:#FFFFFF; --sun:#FFC63A; --sun-ink:#3A2A00; --ok:#17925F; --bad:#D3263B;
  --display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#162520; --ink:#E8F1ED; --muted:#93A79F; --line:#2A3D36; --chip:#1F332D;
  --accent:#FF6655; --accent-ink:#1A0602; --sun:#FFD25E; --sun-ink:#2A1E00; --ok:#3CCB8E; --bad:#FF6375; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#162520; --ink:#E8F1ED; --muted:#93A79F; --line:#2A3D36; --chip:#1F332D;
  --accent:#FF6655; --accent-ink:#1A0602; --sun:#FFD25E; --sun-ink:#2A1E00; --ok:#3CCB8E; --bad:#FF6375; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:0;display:flex;align-items:center;gap:8px}
.logo .mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:24px;transform:rotate(-6deg)}
.codechip{font-variant-numeric:tabular-nums;background:var(--chip);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.1}
h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2}
h3{font-size:15px;font-weight:600;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px;background:var(--chip);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.sun{background:var(--sun);color:var(--sun-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;padding:6px 8px;color:var(--muted);text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 160px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:8px 14px;border:2px solid transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:r}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:r}
.rules li::before{content:counter(r);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:14px}
.bigcode{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:6px;font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:500;font-size:15px}
.pchip .dot{width:10px;height:10px;border-radius:50%}
.pchip.done{background:var(--ok);color:var(--surface)}
.ptbadge{font-size:13px;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:1px 6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:34px;line-height:1;min-width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums}
.timer.low{background:var(--accent);color:var(--accent-ink)}
.question{font-family:var(--display);font-size:36px;line-height:1.25;text-wrap:balance}
.points{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.points button{padding:10px 0;font-variant-numeric:tabular-nums;font-size:17px;border:2px solid transparent}
.points button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);border-color:var(--ink)}
.points button.used{text-decoration:line-through}
.count{font-family:var(--display);font-size:120px;line-height:1;text-align:center;color:var(--accent)}
.groups{display:grid;gap:10px}
.group{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:start;color:var(--ink);font-weight:400}
button.group{width:100%}
.group[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
.group .gtext{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group.rejected .gtext{text-decoration:line-through;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--display);font-size:16px;line-height:1;padding:6px 10px 4px;border:2.5px solid currentColor;border-radius:8px;transform:rotate(-4deg);white-space:nowrap}
.stamp.uniq{color:var(--ok)}
.stamp.copy{color:var(--bad)}
.stamp.rej{color:var(--muted)}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:none}
.res .who{font-weight:600}
.res .ans{color:var(--muted);font-size:15px;min-width:0;overflow-wrap:anywhere}
.rank{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--chip)}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{font-family:var(--display);font-size:22px;line-height:1;text-align:center}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.delta{font-size:13px;font-weight:700;margin-inline-start:6px;direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--surface);border-radius:6px;padding:0 6px}
.delta.pos{color:var(--ok)} .delta.neg{color:var(--muted)}
.notice{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:15px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1em}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.toolbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.toolbar button{flex:1 1 120px;padding:10px 12px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}}
@media (max-width:420px){h1{font-size:38px}.question{font-size:30px}.bigcode{font-size:52px}}
body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);opacity:.6;transition:opacity .15s,border-color .15s}
.cat.on{opacity:1;border-color:var(--ink);background:var(--chip)}
.cat.open{outline:2px solid var(--sun)}
.cat-main{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border-radius:0;padding:10px 8px 10px 4px;font-size:14px;text-align:start;flex-wrap:nowrap}
.cat-main .cn{min-width:0;line-height:1.3}
.cat-main[aria-disabled="true"]{cursor:default}
.cat-main .ce{font-size:18px}
.cat-main .cn{font-weight:600}
.cat-main .ck{margin-inline-start:auto;font-weight:800;color:var(--ok)}
.cat-info{background:none;border-radius:0;padding:0 12px;border-inline-start:1px solid var(--line);font-family:Georgia,serif;font-style:italic;font-weight:700;color:var(--muted);font-size:16px}
.newb{display:inline-block;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;letter-spacing:.3px}
.catinfo{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.qcat{display:inline-block;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 8px;margin-inline-start:6px;vertical-align:middle}
.small-btn{padding:7px 12px;font-size:14px;border-radius:10px}
.small-btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.winner h1{font-size:40px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:8px;width:100%}
.pod{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .pn{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ps{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:14px}
.pod .pb{width:100%;display:grid;place-items:center;border-radius:12px 12px 0 0;font-family:var(--display);font-size:30px;color:var(--ink)}
.pod.p1 .pb{height:120px;background:var(--sun);color:var(--sun-ink)}
.pod.p2 .pb{height:85px;background:var(--chip)}
.pod.p3 .pb{height:60px;background:var(--line)}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ttl{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:14px;padding:12px}
.ttl .te{font-size:30px;line-height:1}
.ttl .tw{font-weight:700;color:var(--accent)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:420px;max-height:90vh;overflow:auto}
.modal img{border-radius:12px}
</style>
</head>

/* توزيع الجولات بالتساوي على الفئات المختارة، وبدون تكرار لين تخلص أسئلة الفئة */
function pickQs(){
  const n = room.settings.rounds, cats = selCats();
  const used = new Set((room.usedQ || []).filter(x => typeof x === 'string'));
  const share = {}; cats.forEach(c => share[c] = Math.floor(n / cats.length));
  shuffle(cats).slice(0, n % cats.length).forEach(c => share[c]++);
  const picked = []; let short = 0;
  for (const c of cats){
    const all = catPool(c);
    let fresh = shuffle(all.filter(id => !used.has(id)));
    if (fresh.length < share[c]){ all.forEach(id => used.delete(id)); fresh = shuffle(all) }
    const take = fresh.slice(0, share[c]); short += share[c] - take.length; picked.push(...take);
  }
  if (short > 0) picked.push(...shuffle(cats.flatMap(catPool).filter(id => !picked.includes(id))).slice(0, short));
  picked.forEach(id => used.add(id));
  const nm = nameQueue();
  return { qs: shuffle(picked).map(id => buildQ(id, nm)), usedQ: [...used] };
}
function cancelQuestion(){
  const cur = curQ(), inGame = new Set(room.qs.map(q => q.id)), used = new Set((room.usedQ || []).filter(x => typeof x === 'string'));
  let cand = catPool(cur.c || selCats()[0]).filter(id => !inGame.has(id));
  let fresh = cand.filter(id => !used.has(id));
  if (!fresh.length) fresh = cand;
  if (!fresh.length) fresh = selCats().flatMap(catPool).filter(id => !inGame.has(id));
  const id = shuffle(fresh)[0];
  const q = buildQ(id, () => shuffle(players)[0]?.name || 'فلان');
  const qs = room.qs.slice(); qs[room.round - 1] = q; used.add(id);
  const t = sNow();
  hostSet({ status: 'countdown', qs, usedQ: [...used], phaseAt: t, phaseDur: COUNT_MS, cancelAt: t, review: { merge: {}, rejected: [] } });
}

/* ---------- Room lifecycle ---------- */
async function createRoom(name){
  let c;
  for (let i = 0; i < 8; i++){ c = String(1000 + Math.floor(Math.random()*9000)); const s = await db.doc('rooms/' + c).get(); if (!s.exists || (Date.now() - (s.data().createdAt||0)) > 864e5) break }
  await db.doc('rooms/' + c).set({ code: c, hostId: myId, status: 'lobby', game: 1, round: 0, settings: { rounds: 10, time: 20, cats: ALL_CATS }, qs: [], usedQ: [], hist: [], phaseAt: Date.now(), phaseDur: 0, scores: {}, review: { merge: {}, rejected: [] }, last: null, createdAt: Date.now() });
  await joinRoom(c, name);
}
async function joinRoom(c, name){
  const s = await db.doc('rooms/' + c).get();
  if (!s.exists){ const e = new Error('nf'); e.userMsg = 'ما لقينا غرفة بهالرقم.'; throw e }
  const pref = db.doc(`rooms/${c}/players/${myId}`);
  const ps = await pref.get();
  await pref.set({ name, joinedAt: ps.exists ? (ps.data().joinedAt || Date.now()) : Date.now() });
  enterRoom(c);
}
function enterRoom(c){
  leaveSubs(); code = c; room = null; players = []; answers = []; viewKey = ''; phaseKey = ''; wasIn = false;
  syncClock(); keepAwake();
  LS.set('lt_room', c);
  unsubs.push(db.doc('rooms/' + c).onSnapshot(s => {
    if (!s.exists){ goHome('الغرفة انحذفت.'); return }
    room = s.data(); render();
  }, onDbErr));
  unsubs.push(db.collection(`rooms/${c}/players`).orderBy('joinedAt').onSnapshot(s => {
    players = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const inNow = players.some(p => p.id === myId);
    if (inNow) wasIn = true;
    else if (wasIn && !s.metadata.fromCache) { goHome('خرجت من الغرفة.'); return }
    render();
  }, onDbErr));
  unsubs.push(db.collection(`rooms/${c}/answers`).onSnapshot(s => { answers = s.docs.map(d => d.data()); render() }, onDbErr));
  app.innerHTML = header() + `<section class="card center"><p class="muted">جاري الدخول للغرفة…</p></section>`;
}
function onDbErr(e){ console.error(e) }
function leaveSubs(){ unsubs.forEach(u => { try{u()}catch{} }); unsubs = [] }
function goHome(msg){ leaveSubs(); code = null; room = null; mgmtOpen = false; LS.del('lt_room'); renderHome(msg) }
async function leaveRoom(){
  const others = players.filter(p => p.id !== myId);
  try {
    if (isHost() && others.length) await roomRef().set({ ...room, hostId: others[0].id });
    await db.doc(`rooms/${code}/players/${myId}`).delete();
    if (!others.length) await roomRef().delete();
  } catch(e){ console.error(e) }
  goHome();
}

/* ---------- Timing (server clock) ---------- */
async function syncClock(){
  const ref = db.doc(`rooms/${code}/players/${myId}`);
  let best = Infinity;
  for (let i = 0; i < 4; i++){
    try {
      const t0 = Date.now();
      await ref.set({ ping: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      const t1 = Date.now();
      const snap = await ref.get({ source: 'server' });
      const ts = snap.data() && snap.data().ping;
      if (ts && (t1 - t0) < best){ best = t1 - t0; offset = ts.toMillis() - (t0 + t1) / 2 }
    } catch(e){ console.error(e) }
  }
}
async function keepAwake(){
  try { if (navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen') } catch {}
}
document.addEventListener('visibilitychange', () => { if (code && document.visibilityState === 'visible') keepAwake() });
function eff(){
  if (room.status === 'countdown' && sNow() >= room.phaseAt + room.phaseDur)
    return { status: 'question', phaseAt: room.phaseAt + room.phaseDur, phaseDur: room.settings.time * 1000 };
  return { status: room.status, phaseAt: room.phaseAt, phaseDur: room.phaseDur };
}
async function hostSet(patch){
  if (busy) return; busy = true;
  try { const next = { ...room, ...patch }; await roomRef().set(next) } catch(e){ console.error(e) } finally { busy = false }
}
function hostTick(){
  if (!room || !isHost() || busy || !players.length) return;
  const now = sNow(), el = now - room.phaseAt;
  if (room.status === 'countdown' && el >= room.phaseDur){ const q0 = room.phaseAt + room.phaseDur; hostSet({ status: 'question', phaseAt: q0, qAt: q0, phaseDur: room.settings.time * 1000 }) }
  else if (room.status === 'question'){
    const got = new Set(roundAnswers().map(a => a.uid));
    if (el >= room.phaseDur + GRACE_MS || players.every(p => got.has(p.id))) hostSet({ status: 'review', phaseAt: now, phaseDur: 0, review: { merge: {}, rejected: [] } });
  }
  else if (room.status === 'result' && el >= room.phaseDur){
    if (room.round >= room.settings.rounds) hostSet({ status: 'over', phaseAt: now, phaseDur: 0 });
    else hostSet({ status: 'countdown', round: room.round + 1, phaseAt: now, phaseDur: COUNT_MS });
  }
}
function tick(){
  if (room && code && players.length){ const E = eff(); if (`${E.status}-${room.game}-${room.round}` !== viewKey.split('|')[0]) render() }
  const now = sNow();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const left = Math.max(0, Math.ceil((localDeadline - now) / 1000));
    if (el.textContent !== String(left)) el.textContent = left;
    el.classList.toggle('low', el.classList.contains('timer') && left <= 5);
  });
  if (room && eff().status === 'question' && !myAnswer() && autoSent !== phaseKey && now >= localDeadline - 250){
    autoSent = phaseKey;
    if (draft.text.trim()) submitAnswer(true);
    else { const inp = document.getElementById('ans'); if (inp) inp.disabled = true }
  }
  hostTick();
}

  localDeadline = E.phaseAt + E.phaseDur;
  if (key !== phaseKey){ phaseKey = key; if (st === 'question') draft = { text: '', points: null }; if (st === 'review') sel = new Set() }
  const full = key + '|' + (curQ().k || '');

/* ---------- Titles ---------- */
function titles(){
  const st = {}, present = new Set(players.map(p => p.id));
  const get = u => st[u] || (st[u] = { uniq: 0, copy: 0, lost: 0, best: 0, times: [] });
  for (const r of (room.hist || [])) for (const i of r.it){
    const s = get(i.u);
    if (i.s === 'unique'){ s.uniq++; s.best = Math.max(s.best, i.d) } else { if (i.s === 'copied') s.copy++; s.lost += i.p }
    if (i.t > 0) s.times.push(i.t);
  }
  const ids = Object.keys(st).filter(u => present.has(u));
  const avg = s => s.times.length >= 3 ? s.times.reduce((a, b) => a + b, 0) / s.times.length : null;
  const top = (f, min, low) => {
    const v = ids.map(u => [u, f(st[u])]).filter(([, x]) => x != null && (low || x >= min));
    if (!v.length) return null;
    const b = low ? Math.min(...v.map(x => x[1])) : Math.max(...v.map(x => x[1]));
    return { ids: v.filter(x => x[1] === b).map(x => x[0]), v: b };
  };
  const sec = ms => (ms / 1000).toFixed(1);
  const list = [
    { e: '🧠', n: 'العبقري', w: v => `${plural(v, 'إجابة فريدة', 'إجابات فريدة')}`, r: top(s => s.uniq, 1) },
    { e: '🦜', n: 'أكبر مقلّد', w: v => `انقلّد ${plural(v, 'مرة', 'مرات')}`, r: top(s => s.copy, 1) },
    { e: '🎲', n: 'المراهن المجنون', w: v => `كسب ${v} في جولة وحدة`, r: top(s => s.best, 1) },
    { e: '💸', n: 'مضيّع النقاط', w: v => `ضيّع ${plural(v, 'نقطة', 'نقاط')}`, r: top(s => s.lost, 1) },
    { e: '⚡', n: 'البرق', w: v => `يجاوب في ${sec(v)} ثانية بالمتوسط`, r: ids.length > 1 ? top(avg, 0, true) : null },
    { e: '🐢', n: 'آخر واحد يجاوب', w: v => `يجاوب في ${sec(v)} ثانية بالمتوسط`, r: ids.length > 1 ? top(avg, 0) : null },
  ];
  return list.filter(t => t.r).map(t => ({ ...t, who: t.r.ids.map(pName).join('، '), why: t.w(t.r.v) }));
}

  const av = available();
  if (!draft.points && !auto){ const l = document.getElementById('ptsel'); if (l){ l.textContent = '— اختر نقاط أول'; l.style.color = 'var(--bad)' } return }
  const points = av.includes(draft.points) ? draft.points : av[0] || 1;
  if (btn) btn.disabled = true;
  try {
    await db.doc(`rooms/${code}/answers/${room.game}_${room.round}_${myId}`).set({ game: room.game, round: room.round, k: curQ().k, uid: myId, text: text.slice(0, 40), points, at: sNow() });
  } catch(e){ console.error(e); if (btn) btn.disabled = false }
}
async function confirmRound(){
  const gs = groupsFor(), items = [];
  for (const g of gs) for (const a of g.items){
    const status = g.rejected ? 'rejected' : g.items.length > 1 ? 'copied' : 'unique';
    items.push({ uid: a.uid, text: a.text, points: a.points, status, delta: status === 'unique' ? a.points : 0, t: room.qAt ? Math.max(0, a.at - room.qAt) : 0 });
  }
  const scores = { ...(room.scores||{}) };
  for (const i of items) scores[i.uid] = (scores[i.uid] || 0) + i.delta;
  const hist = (room.hist || []).concat([{ r: room.round, it: items.map(i => ({ u: i.uid, s: i.status, p: i.points, d: i.delta, t: i.t })) }]);
  await hostSet({ status: 'result', scores, hist, last: { round: room.round, items }, phaseAt: sNow(), phaseDur: RESULT_MS });
}

/* ---------- Boot ---------- */
async function boot(){
  renderHome();
  try {
    if (!window.firebase || String(firebaseConfig.apiKey).includes('PASTE')) { window.__cfgMissing = true; throw new Error('config') }
    firebase.initializeApp(firebaseConfig);
    const cred = await firebase.auth().signInAnonymously();
    myId = cred.user.uid;
    db = firebase.firestore();
  } catch(e){ console.error(e); db = null }
  window.__ready = true;
  const saved = LS.get('lt_room'), fromUrl = urlRoom();
  if (db && myId && saved && (!fromUrl || fromUrl === saved)){
    try {
      const [r, p] = await Promise.all([db.doc('rooms/' + saved).get(), db.doc(`rooms/${saved}/players/${myId}`).get()]);
      if (r.exists && p.exists){ enterRoom(saved); return }
    } catch(e){ console.error(e) }
    LS.del('lt_room');
  }
  renderHome();
  if (fromUrl && db) { const nm = document.getElementById('nm'); if (nm && !nm.value) nm.focus() }
}
boot();
</script>
